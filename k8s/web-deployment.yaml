apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamflix-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamflix-web
  template:
    metadata:
      labels:
        app: streamflix-web
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/streamflix-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: streamflix-web
spec:
  type: NodePort
  selector:
    app: streamflix-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
