apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamflix-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamflix-web
  template:
    metadata:
      labels:
        app: streamflix-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/streamflix-web:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: streamflix-web
spec:
  type: NodePort
  selector:
    app: streamflix-web
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
